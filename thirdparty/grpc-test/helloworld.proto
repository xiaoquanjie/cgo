syntax = "proto3";
package helloworld;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  rpc GetName (FamilyRequest) returns (FamilyResponse) {}
  rpc ListName(stream FamilyRequest) returns (stream FamilyResponse) {}
  rpc ClientStreamSayHello(stream HelloRequest) returns (HelloReply) {}
  rpc ServerStreamSayHello(HelloRequest) returns (stream HelloReply) {}
}

service GreeterAgain {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  rpc GetName (FamilyRequest) returns (FamilyResponse) {}
  rpc ListName(stream FamilyRequest) returns (stream FamilyResponse) {}
  rpc ClientStreamSayHello(stream HelloRequest) returns (HelloReply) {}
  rpc ServerStreamSayHello(HelloRequest) returns (stream HelloReply) {}
}

message HelloRequest {
  string name = 1;
  int32  count = 2;
}

message HelloReply {
  string message = 1;
}

service NameServer {
    rpc ListName(stream FamilyRequest) returns (stream FamilyResponse) {}
}

message FamilyRequest {
    string family = 1;
}

message FamilyResponse {
    string name = 1;
}