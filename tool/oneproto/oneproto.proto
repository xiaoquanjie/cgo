syntax = "proto3";
package protocol;
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";option go_package = "./protocol;protocol";

service service1 {
   rpc method1(Request1) returns (Respond1) {}
   rpc method2(stream Request1) returns (Respond1) {}
   rpc method3(Request1) returns (stream Respond1) {}
   rpc method4(stream Request1) returns (stream Respond1) {}
}

enum EnumType {
   DB_MIN = 0;
   MYSQL = 1;
   MONGO = 2;
   DB_MAX = 3;
}

message Request1 {
   int32 id = 1;
   repeated string names = 2;
   google.protobuf.Any msg = 3;
}

message Respond1 {
}

message OutMessage {
   Request1 req = 1;
   map<int32, int32> info = 2;
   map<string, Request1> info2 = 3;
   repeated Request1 reqs = 4;
   EnumType type = 5;
}

service service2 {
   rpc method1(Request2) returns (Respond2) {}
   rpc method2(stream Request2) returns (Respond2) {}
   rpc method3(Request2) returns (stream Respond2) {}
   rpc method4(stream Request2) returns (stream Respond2) {}
}

message Request2 {
}

message Respond2 {
}
