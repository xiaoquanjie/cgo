syntax = "proto3";
package rmdb;

option go_package="./;rmdb";

enum ContentType {
  PLAIN = 0;  // 普通字符串, 默认.
  binary = 1; // 二进制.
  BSON = 2;   // bson.
}

message KeyData {
  string key = 1;
  string val = 2;
}

// 元数据.
message MetaData {
  string table = 1; // 表名.
  map<string, string> keys = 2; // 键.
  uint32 cache_expire = 3;   // 在缓存里的超时时间.
  ContentType type = 4; // 数据类型：plain or binary or json.
  string db = 5;    // 数据库名.
}
